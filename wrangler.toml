# Cloudflare Pages configuration.
# With this file in the repo, a Git-connected Pages project takes its build
# output directory and bindings from here rather than from the dashboard.

name = "selflearnanything"
pages_build_output_dir = "./public"
compatibility_date = "2026-06-01"

# Sync storage. Namespace "selflearnanything-sync".
[[kv_namespaces]]
binding = "SLA_KV"
id = "da2311285be543f0a65e685dd59435a2"
